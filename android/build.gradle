allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

subprojects { project ->
    if (project.path != ':app' && !project.extensions.extraProperties.has('flutter')) {
        project.extensions.extraProperties.set('flutter', [
            compileSdkVersion: 35,
            minSdkVersion    : 21,
            targetSdkVersion : 35,
            ndkVersion       : '27.0.12077973',
        ])
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
